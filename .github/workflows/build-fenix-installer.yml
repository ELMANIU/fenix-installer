name: Build FENIX Installer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FenixTVInstaller_Source.zip'
      - '.github/workflows/build-fenix-installer.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q FenixTVInstaller_Source.zip -d build-src
          ls -la build-src/FenixInstaller

      - name: Build debug APK
        working-directory: build-src/FenixInstaller
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp build-src/FenixInstaller/app/build/outputs/apk/debug/app-debug.apk FenixTVInstaller.apk
          sha256sum FenixTVInstaller.apk > FenixTVInstaller.apk.sha256
          ls -lh FenixTVInstaller.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FenixTVInstaller
          path: |
            FenixTVInstaller.apk
            FenixTVInstaller.apk.sha256
          if-no-files-found: error
          retention-days: 30
